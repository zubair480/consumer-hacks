# Phase 1 Revyl test 1: App launches
id: 01-app-launches
name: "App launches"
device: iPhone 16 (Revyl cloud simulator)
build: Release iphonesimulator, JS bundled, EXPO_PUBLIC_CONVEX_URL=https://pleasant-lark-678.convex.cloud
fixtures: tests/revyl/fixtures/fixtures.json
steps:
  - "Install the Release simulator build on a fresh iPhone 16 and launch it."
  - "Tap `zap-intro-skip`. `welcome-screen` shows the Zapy wordmark, \"Your saves, done.\" and one button; tap `onboarding-start`."
  - "About you (one scrollable form): type \"Revyl Tester\" into `onboarding-input-name`, tap `onboarding-chip-undergraduate`, type \"Computer Science\" into `onboarding-input-fieldOfStudy` and \"San Francisco\" into `onboarding-input-city`. Check there is no country, citizenship or GPA input and no step progress. Tap `onboarding-next` (Continue)."
  - "Complete your account: type \"revyl@example.com\" into `account-email`, \"+1 415 555 0100\" into `account-phone`, leave `account-connect-x` and the GitHub stars row (`import-source-github`) alone, and tap `account-continue`."
  - "Connect your calendar: `calendar-connect-card` is visible when Composio is configured; tap `calendar-skip` (Not now)."
  - "`pull-screen` appears; wait for `pull-see-tasks` and tap it."
  - "Tap the You tab and check `profile-name-input` shows \"Revyl Tester\", `profile-city-input` shows San Francisco and `profile-email-input` shows revyl@example.com."
expect:
  - "The app opens past the boot spinner, walks Start → About you → Complete your account → Connect your calendar, reaches `pull-screen` and then `home-screen`, with no red box or crash."
  - "Every answer is saved: the You tab shows the values typed during onboarding."
  - "Relaunching the app goes straight to `home-screen`; onboarding does not show again."
evidence: one screenshot per step, saved as renders/CONS-9/01-app-launches-<step>.png
