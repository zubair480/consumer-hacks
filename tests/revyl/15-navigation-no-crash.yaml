# Phase 1 Revyl test 15: Navigation doesn't crash
id: 15-navigation-no-crash
name: "Navigation doesn't crash"
device: iPhone 16 (Revyl cloud simulator)
build: Release iphonesimulator, JS bundled, EXPO_PUBLIC_CONVEX_URL=https://pleasant-lark-678.convex.cloud
fixtures: tests/revyl/fixtures/fixtures.json
steps:
  - "Visit every tab (Home, You) and the Home To review / All / Done tabs, open an item, its actions, a result, go back each time, open and close Capture."
  - "Use the Home search pill (`home-search-pill`) to filter the list."
expect:
